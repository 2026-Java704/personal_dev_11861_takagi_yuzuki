<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ジャンル追加画面</title>
<link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
	
	<header th:replace="~{conclusion/header}"></header>

	<div th:replace="~{conclusion/navigation}"></div>
	
	<div id="container">
	
		<aside th:replace="~{conclusion/sideber}"></aside>
	
	<main>
		
		<th:block th:if="${errer}">
			<div th:text="${errer}" class="errer"></div>
		</th:block>
		
	<form th:action="@{/genres/add}" method="post">
		<table border="1">
			<tr>
				<th>ジャンル名</th>
				<td>
					<input type="text" name="genreName" th:value="${genre.genreName}">
				</td>
			</tr>
			<tr>
				<th>収支</th>
				<td>
					収入<input type="radio" name="isIncome" value="true" th:checked="${genre.isIncome == true}">
					支出<input type="radio" name="isIncome" value="false" th:checked="${genre.isIncome == falsu}">
				</td>
			</tr>
		</table>
		<div id="edge">
			<a class="return" th:href="@{/genres}">戻る</a>
			<input class="button" type="submit" value="登録">
		</div>
	</form>
	</main>
	
	</div>
	
	<footer th:replace="~{conclusion/footer}"></footer>
	
</body>
</html>
