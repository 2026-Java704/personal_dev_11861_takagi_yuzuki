<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ユーザー登録画面</title>
	<link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="center">

	<header>新規登録</header>
	
	<main>
		
		<th:block th:if="${errers}">
			<ul>
				<li th:each="errer : ${errers}" th:text="${errer}" class="errer"></li>
			</ul>
		</th:block>
	
	<form th:action="@{/register}" method="post">
		名前　　　　　：<input type="text" name="name" th:value="${user.userName}" placeholder="20文字以内">
		<br>メールアドレス：<input type="email" name="email" th:value="${user.email}">
		<br>パスワード　　：<input type="password" name="password" placeholder="6文字以上、16文字以内">
		<br>パスワード確認：<input type="password" name="passwordConfirm">
		<br><input type="submit" value="登録">
	</form>
	
	<a th:href="@{/}">ログインはこちら</a>
	
	</main>

</body>

</html>
