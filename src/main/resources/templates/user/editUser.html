<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
	<header th:replace="~{conclusion/header}"></header>
	
	<div id="container">
	
	<aside th:replace="~{conclusion/sideber}"></aside>
	
	<main>
		
		<h2>アカウント情報変更</h2>
		
		<form th:action="@{/account/edit}" method="post">
		
		<table border="1">
			<tr>
				<th>名前</th>
				<td>
					<input type="text" name="userName" th:value="${user.userName}">
				</td>
			</tr>
			<tr>
				<th>メールアドレス</th>
				<td>
					<input type="text" name="email" th:value="${user.email}">
				</td>
			</tr>
			<tr>
				<th>変更前パスワード</th>
				<td>
					<input type="password" name="pass">
				</td>
			</tr>
			<tr>
				<th>変更後パスワード</th>
				<td>
					<input type="password" name="password">
				</td>
			</tr>
			<tr>
				<th>パスワード確認</th>
				<td>
					<input type="password" name="passwordConfim">
				</td>
			</tr>
		</table>
		
		<input type="submit" value="更新">
		
		</form>
		
		
		<a th:href="@{/account}">戻る</a>
		
	</main>
	
	</div>
	
	<footer th:replace="~{conclusion/footer}"></footer>
</body>
</html>
